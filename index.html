<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body.login-body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
    background: #0f0b1e;
  }

  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    z-index: 0;
  }

  .bg-blob.b1 {
    width: 480px; height: 480px;
    background: #6d28d9;
    top: -160px; left: -140px;
    animation: float1 12s ease-in-out infinite;
  }

  .bg-blob.b2 {
    width: 420px; height: 420px;
    background: #ec4899;
    bottom: -160px; right: -120px;
    animation: float2 14s ease-in-out infinite;
  }

  .bg-blob.b3 {
    width: 300px; height: 300px;
    background: #0ea5e9;
    top: 40%; right: 8%;
    animation: float1 16s ease-in-out infinite reverse;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.06); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-25px, 25px) scale(1.08); }
  }

  .login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 408px;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    padding: 44px 36px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.5);
    animation: rise 0.5s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: var(--gradient-brand);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    box-shadow: 0 10px 26px rgba(109, 40, 217, 0.4);
  }

  .login-card h1 {
    font-size: 23px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 6px;
  }

  .login-card .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 28px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper svg.leading-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    color: var(--muted);
  }

  .login-card input[type="text"],
  .login-card input[type="password"] {
    width: 100%;
    padding: 12px 14px 12px 40px;
    font-size: 14.5px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .login-card input:focus {
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    background: #fff;
  }

  .login-card input.error {
    border-color: var(--danger);
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 6px;
  }

  .toggle-password:hover { color: var(--accent-2); }

  .form-alert {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(220, 38, 38, 0.08);
    color: var(--danger);
    border: 1px solid rgba(220, 38, 38, 0.25);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 18px;
  }

  .form-alert.show { display: flex; }
  .form-alert svg { width: 16px; height: 16px; flex-shrink: 0; }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 13px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
  }

  .remember-me input {
    width: 15px;
    height: 15px;
    accent-color: var(--accent-2);
  }

  .forgot-link {
    color: var(--accent-2);
    font-weight: 600;
  }

  .forgot-link:hover { text-decoration: underline; }

  .submit-btn {
    width: 100%;
    padding: 13px;
  }

  .demo-hint {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
  }

  .demo-hint b { color: var(--text); }

  @media (max-width: 460px) {
    .login-card { padding: 34px 24px; }
  }
</style>
</head>
<body class="login-body">

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">A</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access your dashboard</p>

    <div class="form-alert" id="formAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="formAlertText">Invalid email or password.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
          <input type="text" id="email" name="email" placeholder="vijay@gmail" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">Sign In</button>
    </form>

    <div class="demo-hint">Demo login &mdash; <b>vijay@gmail</b> / <b>Vijay1304</b></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  var VALID_EMAIL = "vijay@gmail";
  var VALID_PASSWORD = "Vijay1304";

  var form = document.getElementById("loginForm");
  var emailInput = document.getElementById("email");
  var passwordInput = document.getElementById("password");
  var togglePassword = document.getElementById("togglePassword");
  var formAlert = document.getElementById("formAlert");
  var formAlertText = document.getElementById("formAlertText");

  togglePassword.addEventListener("click", function () {
    var isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePassword.textContent = isPassword ? "Hide" : "Show";
  });

  function clearErrors() {
    emailInput.classList.remove("error");
    passwordInput.classList.remove("error");
    formAlert.classList.remove("show");
  }

  function showAlert(message) {
    formAlertText.textContent = message;
    formAlert.classList.add("show");
    emailInput.classList.add("error");
    passwordInput.classList.add("error");
  }

  [emailInput, passwordInput].forEach(function (el) {
    el.addEventListener("input", clearErrors);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var email = emailInput.value.trim();
    var password = passwordInput.value;

    if (!email || !password) {
      showAlert("Please fill in both fields.");
      return;
    }

    if (email === VALID_EMAIL && password === VALID_PASSWORD) {
      App.login(email);
      window.location.href = "dashboard.html";
    } else {
      showAlert("Invalid email or password.");
    }
  });

  // If already logged in, skip straight to dashboard.
  if (App.isLoggedIn()) {
    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
