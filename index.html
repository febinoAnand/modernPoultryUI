<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">A</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your organisation's dashboard</p>

    <div class="form-alert" id="formAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="formAlertText">Invalid credentials.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="orgId">Organisation ID</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><line x1="3" y1="13" x2="21" y2="13"/></svg>
          <input type="text" id="orgId" name="orgId" placeholder="e.g. AGRITRADE" autocomplete="organization" required>
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="username" name="username" placeholder="e.g. vijay" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">Sign In</button>
    </form>

    <div class="demo-hint">Demo login &mdash; Org <b>AGRITRADE</b>, user <b>vijay</b> / <b>Vijay1304</b></div>

    <p class="auth-switch">New organisation? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/data.js"></script>
<script>
  var DEMO_ORG = "AGRITRADE";
  var DEMO_USERNAME = "vijay";
  var DEMO_PASSWORD = "Vijay1304";
  var DEMO_EMAIL = "vijay@gmail";

  var form = document.getElementById("loginForm");
  var orgIdInput = document.getElementById("orgId");
  var usernameInput = document.getElementById("username");
  var passwordInput = document.getElementById("password");
  var togglePassword = document.getElementById("togglePassword");
  var formAlert = document.getElementById("formAlert");
  var formAlertText = document.getElementById("formAlertText");

  togglePassword.addEventListener("click", function () {
    var isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePassword.textContent = isPassword ? "Hide" : "Show";
  });

  function clearErrors() {
    orgIdInput.classList.remove("error");
    usernameInput.classList.remove("error");
    passwordInput.classList.remove("error");
    formAlert.classList.remove("show");
  }

  [orgIdInput, usernameInput, passwordInput].forEach(function (el) {
    el.addEventListener("input", clearErrors);
  });

  function showAlert(message) {
    formAlertText.textContent = message;
    formAlert.classList.add("show");
    orgIdInput.classList.add("error");
    usernameInput.classList.add("error");
    passwordInput.classList.add("error");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var orgId = orgIdInput.value.trim();
    var username = usernameInput.value.trim();
    var password = passwordInput.value;

    if (!orgId || !username || !password) {
      showAlert("Please fill in all fields.");
      return;
    }

    if (orgId.toUpperCase() === DEMO_ORG && username.toLowerCase() === DEMO_USERNAME && password === DEMO_PASSWORD) {
      App.login(DEMO_EMAIL, DEMO_ORG);
      window.location.href = "dashboard.html";
      return;
    }

    var org = Data.authenticateOrganization(orgId, username, password);
    if (org) {
      if (org.status !== "Active") {
        sessionStorage.setItem("ui_pending_org", org.orgId);
        window.location.href = "awaiting-approval.html";
        return;
      }
      App.login(org.email, org.orgId);
      window.location.href = "dashboard.html";
    } else {
      showAlert("Invalid organisation ID, username or password.");
    }
  });

  // If already logged in, skip straight to dashboard.
  if (App.isLoggedIn()) {
    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
