<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  :root {
    --bg-gradient-start: #4f46e5;
    --bg-gradient-end: #7c3aed;
    --card-bg: #ffffff;
    --text-primary: #1f2937;
    --text-secondary: #6b7280;
    --border-color: #e5e7eb;
    --input-bg: #f9fafb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --error: #dc2626;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
    padding: 20px;
  }

  .login-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 400px;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }

  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border-color);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    background: #fff;
  }

  input.error {
    border-color: var(--error);
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 6px;
  }

  .toggle-password:hover {
    color: var(--accent);
  }

  .error-message {
    color: var(--error);
    font-size: 12.5px;
    margin-top: 5px;
    display: none;
  }

  .error-message.show {
    display: block;
  }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    font-size: 13.5px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
  }

  .remember-me input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  .forgot-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  button.submit-btn {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button.submit-btn:hover {
    background: var(--accent-hover);
  }

  button.submit-btn:active {
    transform: scale(0.98);
  }

  .signup-text {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-secondary);
  }

  .signup-text a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  .signup-text a:hover {
    text-decoration: underline;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #16a34a;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    z-index: 10;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Mobile tweaks */
  @media (max-width: 420px) {
    .login-card {
      padding: 32px 22px;
      border-radius: 14px;
    }

    h1 {
      font-size: 21px;
    }
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --card-bg: #1f2330;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-color: #333a4d;
      --input-bg: #262b3a;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      background: #262b3a;
    }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">A</div>
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to continue to your account</p>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email address</label>
      <div class="input-wrapper">
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="error-message" id="emailError">Please enter a valid email address.</div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6">
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">Show</button>
      </div>
      <div class="error-message" id="passwordError">Password must be at least 6 characters.</div>
    </div>

    <div class="row-between">
      <label class="remember-me">
        <input type="checkbox" id="remember" name="remember">
        Remember me
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="submit-btn">Sign in</button>
  </form>

  <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
</div>

<div class="toast" id="toast">Signed in successfully!</div>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const togglePassword = document.getElementById('togglePassword');
  const toast = document.getElementById('toast');

  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    togglePassword.textContent = isPassword ? 'Hide' : 'Show';
    togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function showError(input, errorEl, message) {
    input.classList.add('error');
    errorEl.textContent = message;
    errorEl.classList.add('show');
  }

  function clearError(input, errorEl) {
    input.classList.remove('error');
    errorEl.classList.remove('show');
  }

  emailInput.addEventListener('input', () => clearError(emailInput, emailError));
  passwordInput.addEventListener('input', () => clearError(passwordInput, passwordError));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    if (!isValidEmail(emailInput.value.trim())) {
      showError(emailInput, emailError, 'Please enter a valid email address.');
      valid = false;
    } else {
      clearError(emailInput, emailError);
    }

    if (passwordInput.value.length < 6) {
      showError(passwordInput, passwordError, 'Password must be at least 6 characters.');
      valid = false;
    } else {
      clearError(passwordInput, passwordError);
    }

    if (!valid) return;

    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });

</script>

</body>
</html>
